# Relay's PR review runs on Loopkeeper — the standalone extraction of
# this repository's own review-loop harness (nifabulous/loopkeeper, extracted
# at source commit e834773). This caller replaced the inlined
# .github/workflows/codex-pr-review.yml at v0.1.1.
#
# The reusable workflow keeps the trust separation the inlined version had:
# the eligibility job holds no model secret and re-reads the pull request
# rather than trusting the event snapshot, the review job runs with
# LOOPKEEPER_OPERATOR=0 and read-only permissions, and only the writer job is
# granted pull-requests: write.
#
# Fork pull requests are reviewed only once a maintainer applies the
# `loopkeeper-approved` label; removing it revokes eligibility before the next
# model call.
name: Loopkeeper PR Review

on:
  pull_request_target:
    # labeled/unlabeled are required: applying or revoking the fork approval
    # label must trigger a fresh eligibility evaluation.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  actions: read
  checks: read
  issues: read
  pull-requests: write

jobs:
  targets:
    # Explicit opt-in, matching the gate the inlined reviewer used. Starting a
    # paid external model call and sending PR content to it is a decision the
    # repository has to make on purpose, so an unset variable means off.
    if: >-
      vars.LOOPKEEPER_REVIEW_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_numbers: ${{ steps.select.outputs.pr_numbers }}
    steps:
      - name: Select open PRs at the completed run head
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DIRECT_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || 0 }}
          RUN_SOURCE_EVENT: ${{ github.event.workflow_run.event || '' }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          RUN_PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GH_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || {
            echo "repository must be owner/name" >&2
            exit 2
          }

          if [[ "$EVENT_NAME" != "workflow_run" ]]; then
            [[ "$DIRECT_PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
              echo "a PR number is required" >&2
              exit 2
            }
            echo "pr_numbers=[$DIRECT_PR_NUMBER]" >>"$GITHUB_OUTPUT"
            echo "| Selected PRs | \`[$DIRECT_PR_NUMBER]\` |" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$RUN_SOURCE_EVENT" != "pull_request" || ! "$RUN_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "workflow_run is not a pull_request completion with a full head SHA; selecting no PRs." >&2
            echo 'pr_numbers=[]' >>"$GITHUB_OUTPUT"
            exit 0
          fi

          targets_file="$(mktemp)"
          response_file="$(mktemp)"
          trap 'rm -f "$targets_file" "$response_file"' EXIT
          fallback_recovery=0
          if [[ -z "$RUN_PULL_REQUESTS" || "$RUN_PULL_REQUESTS" == "null" || "$RUN_PULL_REQUESTS" == "[]" ]]; then
            echo "workflow_run has no associated PRs; recovering targets from the run head" >&2
            if ! gh api "repos/${GH_REPO}/commits/${RUN_HEAD_SHA}/pulls?per_page=100" \
              --jq '[.[] | select(.state == "open") | {number: .number}]' \
              >"$response_file" 2>/dev/null; then
              echo "could not recover PR associations from the run head" >&2
              exit 1
            fi
            fallback_recovery=1
            RUN_PULL_REQUESTS="$(<"$response_file")"
          fi
          jq -e 'type == "array"' <<<"$RUN_PULL_REQUESTS" >/dev/null || {
            echo "workflow_run.pull_requests was not an array; selecting no PRs." >&2
            echo 'pr_numbers=[]' >>"$GITHUB_OUTPUT"
            exit 0
          }
          selection_unavailable=0
          while IFS= read -r pr; do
            [[ "$pr" =~ ^[1-9][0-9]*$ ]] || continue
            if ! gh api "repos/${GH_REPO}/pulls/${pr}" \
              --jq '{state: .state, head_sha: (.head.sha // "")}' \
              >"$response_file" 2>/dev/null; then
              echo "could not read PR #${pr}; refusing to guess its current state" >&2
              selection_unavailable=1
              continue
            fi
            state="$(jq -r '.state // ""' "$response_file")"
            head_sha="$(jq -r '.head_sha // ""' "$response_file")"
            if [[ "$state" == "open" && "$head_sha" == "$RUN_HEAD_SHA" ]]; then
              printf '%s\n' "$pr" >>"$targets_file"
            fi
          done < <(jq -r '[.[]? | .number? | select(type == "number")] | unique | .[]' <<<"$RUN_PULL_REQUESTS")

          if (( selection_unavailable )); then
            echo "one or more associated PRs were unverifiable; selecting no PRs." >&2
            echo 'pr_numbers=[]' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          selected_count="$(wc -l <"$targets_file" | tr -d ' ')"
          if (( fallback_recovery )) && [[ "$selected_count" != "1" ]]; then
            echo "run-head recovery found $selected_count open exact-head PRs; a unique target is required" >&2
            echo 'pr_numbers=[]' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -s "$targets_file" ]]; then
            pr_numbers="$(jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)' <"$targets_file")"
          else
            pr_numbers='[]'
          fi
          echo "pr_numbers=$pr_numbers" >>"$GITHUB_OUTPUT"
          {
            echo "## Loopkeeper target selection"
            echo ""
            echo "| Run head | Selected open exact-head PRs |"
            echo "| --- | --- |"
            echo "| \`$RUN_HEAD_SHA\` | \`$pr_numbers\` |"
          } >>"$GITHUB_STEP_SUMMARY"

  review:
    needs: targets
    if: ${{ needs.targets.outputs.pr_numbers != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        pr_number: ${{ fromJSON(needs.targets.outputs.pr_numbers) }}
    uses: nifabulous/loopkeeper/.github/workflows/pr-review-posting.yml@ff1dbeb4f3eee1a45dc34ad1e02c062b93d26231
    with:
      consumer_repo: ${{ github.repository }}
      loopkeeper_repo: nifabulous/loopkeeper
      # Empty resolves to the consumer's default-branch head in the reusable
      # workflow's `resolve` job.
      consumer_trusted_sha: ""
      # Must stay identical to the `uses:` pin above — the release contract
      # requires the checkout SHA and the workflow pin to agree.
      loopkeeper_sha: ff1dbeb4f3eee1a45dc34ad1e02c062b93d26231
      ci_workflow_name: CI
      ci_workflow_file: ci.yml
      pr_number: ${{ matrix.pr_number }}
      expected_head_sha: ${{ github.event.workflow_run.head_sha || '' }}
      job_timeout_seconds: 1200
      post_comments: true
    secrets:
      # Loopkeeper is provider-neutral; this repository already holds an
      # OpenAI key for the retired reviewer, so no new secret is needed.
      model_api_key: ${{ secrets.OPENAI_API_KEY }}
