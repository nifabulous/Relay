# Relay's PR review runs on Loopkeeper — the standalone extraction of
# this repository's own review-loop harness (nifabulous/loopkeeper, extracted
# at source commit e834773). This caller replaced the inlined
# .github/workflows/codex-pr-review.yml at v0.1.1.
#
# The reusable workflow keeps the trust separation the inlined version had:
# the eligibility job holds no model secret and re-reads the pull request
# rather than trusting the event snapshot, the review job runs with
# LOOPKEEPER_OPERATOR=0 and read-only permissions, and only the writer job is
# granted pull-requests: write.
#
# Fork pull requests are reviewed only once a maintainer applies the
# `loopkeeper-approved` label; removing it revokes eligibility before the next
# model call.
name: Loopkeeper PR Review

on:
  pull_request_target:
    # labeled/unlabeled are required: applying or revoking the fork approval
    # label must trigger a fresh eligibility evaluation.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  actions: read
  checks: read
  issues: read
  pull-requests: write

jobs:
  targets:
    # Explicit opt-in, matching the gate the inlined reviewer used. Starting a
    # paid external model call and sending PR content to it is a decision the
    # repository has to make on purpose, so an unset variable means off.
    if: >-
      vars.LOOPKEEPER_REVIEW_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_numbers: ${{ steps.select.outputs.pr_numbers }}
    steps:
      - name: Select open PRs at the completed run head
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DIRECT_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || 0 }}
          RUN_SOURCE_EVENT: ${{ github.event.workflow_run.event || '' }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          RUN_PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        shell: bash
        run: |
          set -euo pipefail
          MAX_WORKFLOW_RUN_TARGETS=256
          [[ "$GH_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || {
            echo "repository must be owner/name" >&2
            exit 2
          }

          if [[ "$EVENT_NAME" != "workflow_run" ]]; then
            [[ "$DIRECT_PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
              echo "a PR number is required" >&2
              exit 2
            }
            echo "pr_numbers=[$DIRECT_PR_NUMBER]" >>"$GITHUB_OUTPUT"
            echo "| Selected PRs | \`[$DIRECT_PR_NUMBER]\` |" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$RUN_SOURCE_EVENT" != "pull_request" || ! "$RUN_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "workflow_run is not a pull_request completion with a full head SHA; selecting no PRs." >&2
            echo 'pr_numbers=[]' >>"$GITHUB_OUTPUT"
            exit 0
          fi

          targets_file="$(mktemp)"
          response_file="$(mktemp)"
          trap 'rm -f "$targets_file" "$response_file"' EXIT
          if [[ -z "$RUN_PULL_REQUESTS" || "$RUN_PULL_REQUESTS" == "null" || "$RUN_PULL_REQUESTS" == "[]" ]]; then
            echo "workflow_run has no associated PRs; recovering targets from the run head" >&2
            fallback_candidates='[]'
            for page in 1 2 3; do
              if ! gh api "repos/${GH_REPO}/commits/${RUN_HEAD_SHA}/pulls?per_page=100&page=${page}" \
                --jq '{returned: length, candidates: [.[] | select(.state == "open") | {number: .number}]}' \
                >"$response_file" 2>/dev/null; then
                echo "could not recover PR associations from the run head" >&2
                exit 1
              fi
              page_returned="$(jq -r '.returned' "$response_file")"
              fallback_candidates="$(
                jq -cn \
                  --argjson accumulated "$fallback_candidates" \
                  --argjson page "$(<"$response_file")" \
                  '$accumulated + $page.candidates'
              )"
              if (( page_returned < 100 )); then
                break
              fi
              if (( page == 3 )); then
                echo "run-head recovery exceeded three 100-item pages; refusing incomplete selection" >&2
                exit 1
              fi
            done
            RUN_PULL_REQUESTS="$fallback_candidates"
          fi
          jq -e 'type == "array"' <<<"$RUN_PULL_REQUESTS" >/dev/null || {
            echo "workflow_run.pull_requests was not an array; selecting no PRs." >&2
            echo 'pr_numbers=[]' >>"$GITHUB_OUTPUT"
            exit 0
          }
          candidate_numbers="$(jq -c '[.[]? | .number? | select(type == "number")] | unique' <<<"$RUN_PULL_REQUESTS")"
          candidate_count="$(jq 'length' <<<"$candidate_numbers")"
          if (( candidate_count > MAX_WORKFLOW_RUN_TARGETS )); then
            echo "$candidate_count unique PR targets exceed GitHub's $MAX_WORKFLOW_RUN_TARGETS-job matrix limit" >&2
            exit 1
          fi
          selection_unavailable=0
          while IFS= read -r pr; do
            [[ "$pr" =~ ^[1-9][0-9]*$ ]] || continue
            if ! gh api "repos/${GH_REPO}/pulls/${pr}" \
              --jq '{state: .state, head_sha: (.head.sha // "")}' \
              >"$response_file" 2>/dev/null; then
              echo "could not read PR #${pr}; refusing to guess its current state" >&2
              selection_unavailable=1
              continue
            fi
            state="$(jq -r '.state // ""' "$response_file")"
            head_sha="$(jq -r '.head_sha // ""' "$response_file")"
            if [[ "$state" == "open" && "$head_sha" == "$RUN_HEAD_SHA" ]]; then
              printf '%s\n' "$pr" >>"$targets_file"
            fi
          done < <(jq -r '.[]' <<<"$candidate_numbers")

          if (( selection_unavailable )); then
            echo "one or more associated PRs were unverifiable; failing target selection." >&2
            exit 1
          fi
          if [[ -s "$targets_file" ]]; then
            pr_numbers="$(jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)' <"$targets_file")"
          else
            pr_numbers='[]'
          fi
          echo "pr_numbers=$pr_numbers" >>"$GITHUB_OUTPUT"
          {
            echo "## Loopkeeper target selection"
            echo ""
            echo "| Run head | Selected open exact-head PRs |"
            echo "| --- | --- |"
            echo "| \`$RUN_HEAD_SHA\` | \`$pr_numbers\` |"
          } >>"$GITHUB_STEP_SUMMARY"

  review:
    needs: targets
    if: ${{ needs.targets.outputs.pr_numbers != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        pr_number: ${{ fromJSON(needs.targets.outputs.pr_numbers) }}
    uses: nifabulous/loopkeeper/.github/workflows/pr-review-posting.yml@ff1dbeb4f3eee1a45dc34ad1e02c062b93d26231
    with:
      consumer_repo: ${{ github.repository }}
      loopkeeper_repo: nifabulous/loopkeeper
      # Empty resolves to the consumer's default-branch head in the reusable
      # workflow's `resolve` job.
      consumer_trusted_sha: ""
      # Must stay identical to the `uses:` pin above — the release contract
      # requires the checkout SHA and the workflow pin to agree.
      loopkeeper_sha: ff1dbeb4f3eee1a45dc34ad1e02c062b93d26231
      ci_workflow_name: CI
      ci_workflow_file: ci.yml
      pr_number: ${{ matrix.pr_number }}
      expected_head_sha: ${{ github.event.workflow_run.head_sha || '' }}
      job_timeout_seconds: 1200
      # The reusable writer uses a fixed 200k comment-page cap that is too
      # small for this repository's long-lived PR histories. Keep its review
      # artifact generation, and publish through the bounded writer below with
      # the repository's larger operator-configured cap.
      post_comments: false
    secrets:
      # Loopkeeper is provider-neutral; this repository already holds an
      # OpenAI key for the retired reviewer, so no new secret is needed.
      model_api_key: ${{ secrets.OPENAI_API_KEY }}

  rebind:
    # Re-publish each immutable review artifact under a PR-specific name before
    # the privileged writer consumes it. The reusable workflow's artifact is
    # run-scoped; metadata/head validation here prevents a matrix entry from
    # rebinding another PR's review.
    needs: [targets, review]
    if: ${{ needs.review.result == 'success' && vars.LOOPKEEPER_REVIEW_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        pr_number: ${{ fromJSON(needs.targets.outputs.pr_numbers) }}
    steps:
      - name: Download run-scoped review artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: loopkeeper-review-${{ github.run_id }}
          path: ${{ github.workspace }}/loopkeeper-review-source

      - name: Verify and rebind PR artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr_number }}
          ARTIFACT_DIR: ${{ github.workspace }}/loopkeeper-review-source
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ -s "$ARTIFACT_DIR/review-metadata.json" && -s "$ARTIFACT_DIR/comment.md" ]]
          jq -e --argjson pr "$PR_NUMBER" --arg sha "$head_sha" \
            '(.schema == 1) and (.pr_number == $pr) and (.head_sha == $sha)' \
            "$ARTIFACT_DIR/review-metadata.json" >/dev/null
          grep -Fq "<!-- loopkeeper-pr-review:${PR_NUMBER}:${head_sha} -->" \
            "$ARTIFACT_DIR/comment.md"
          artifact_sha256="$(sha256sum "$ARTIFACT_DIR/comment.md" | awk '{print $1}')"
          [[ "$artifact_sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "head_sha=$head_sha"
            echo "artifact_sha256=$artifact_sha256"
          } >>"$GITHUB_OUTPUT"

      - name: Upload PR-bound review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loopkeeper-review-${{ github.run_id }}-pr-${{ matrix.pr_number }}
          path: ${{ github.workspace }}/loopkeeper-review-source
          if-no-files-found: error

  writer:
    # Publish only after the trusted reusable review has produced its
    # immutable artifact. The writer has no model secret and re-checks fork
    # eligibility immediately before the comment mutation.
    needs: [targets, rebind]
    if: ${{ needs.rebind.result == 'success' && vars.LOOPKEEPER_REVIEW_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        pr_number: ${{ fromJSON(needs.targets.outputs.pr_numbers) }}
    steps:
      - name: Resolve trusted default branch
        id: roots
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/${GH_REPO}" --jq '.default_branch')"
          consumer_sha="$(gh api "repos/${GH_REPO}/git/ref/heads/${default_branch}" --jq '.object.sha')"
          [[ "$default_branch" =~ ^[A-Za-z0-9._/-]+$ && "$default_branch" != /* && "$default_branch" != *..* ]]
          [[ "$consumer_sha" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "consumer_default_branch=$default_branch"
            echo "consumer_trusted_sha=$consumer_sha"
          } >>"$GITHUB_OUTPUT"

      - name: Check out consumer at trusted default-branch SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.roots.outputs.consumer_trusted_sha }}
          path: consumer
          fetch-depth: 1

      - name: Check out Loopkeeper at immutable release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nifabulous/loopkeeper
          ref: ff1dbeb4f3eee1a45dc34ad1e02c062b93d26231
          path: loopkeeper
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify trusted checkouts
        env:
          CONSUMER_TRUSTED_SHA: ${{ steps.roots.outputs.consumer_trusted_sha }}
          LOOPKEEPER_SHA: ff1dbeb4f3eee1a45dc34ad1e02c062b93d26231
        run: |
          set -euo pipefail
          [[ "$(git -C consumer rev-parse HEAD)" == "$CONSUMER_TRUSTED_SHA" ]]
          [[ "$(git -C loopkeeper rev-parse HEAD)" == "$LOOPKEEPER_SHA" ]]

      - name: Download immutable review artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: loopkeeper-review-${{ github.run_id }}-pr-${{ matrix.pr_number }}
          path: ${{ github.workspace }}/loopkeeper-review-artifact/pr-${{ matrix.pr_number }}

      - name: Resolve and verify PR-bound review artifact
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr_number }}
          ARTIFACT_DIR: ${{ github.workspace }}/loopkeeper-review-artifact/pr-${{ matrix.pr_number }}
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ -s "$ARTIFACT_DIR/review-metadata.json" && -s "$ARTIFACT_DIR/comment.md" ]]
          jq -e --argjson pr "$PR_NUMBER" --arg sha "$head_sha" \
            '(.schema == 1) and (.pr_number == $pr) and (.head_sha == $sha)' \
            "$ARTIFACT_DIR/review-metadata.json" >/dev/null
          grep -Fq "<!-- loopkeeper-pr-review:${PR_NUMBER}:${head_sha} -->" \
            "$ARTIFACT_DIR/comment.md"
          artifact_sha256="$(sha256sum "$ARTIFACT_DIR/comment.md" | awk '{print $1}')"
          [[ "$artifact_sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "head_sha=$head_sha"
            echo "artifact_sha256=$artifact_sha256"
          } >>"$GITHUB_OUTPUT"

      - name: Re-verify fork eligibility before publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr_number }}
          PYTHONPATH: ${{ github.workspace }}/loopkeeper/src
          LOOPKEEPER_CHECK_MAX_RAW_BYTES: ${{ vars.LOOPKEEPER_CHECK_MAX_RAW_BYTES || '1000000' }}
        run: |
          set -euo pipefail
          if ! decision="$(loopkeeper/adapters/github/resolve_pr_eligibility.sh "$PR_NUMBER" 2>/dev/null)"; then
            echo "eligibility could not be verified before comment publication; refusing to write." >&2
            exit 4
          fi
          if [[ "$decision" != "eligible=true reason="* || "$decision" == *$'\n'* ]]; then
            echo "eligibility resolver returned an unexpected result; refusing to write." >&2
            exit 4
          fi

      - name: Publish Loopkeeper review
        working-directory: consumer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LOOPKEEPER_ROOT: ${{ github.workspace }}/loopkeeper
          PYTHONPATH: ${{ github.workspace }}/loopkeeper/src
          LOOPKEEPER_REVIEW_ARTIFACT: ${{ github.workspace }}/loopkeeper-review-artifact/pr-${{ matrix.pr_number }}/comment.md
          LOOPKEEPER_REVIEW_ARTIFACT_SHA256: ${{ steps.pr.outputs.artifact_sha256 }}
          LOOPKEEPER_REVIEW_ENABLED: "true"
          LOOPKEEPER_TRUSTED_SHA: ${{ steps.roots.outputs.consumer_trusted_sha }}
          LOOPKEEPER_DEFAULT_BRANCH: ${{ steps.roots.outputs.consumer_default_branch }}
          LOOPKEEPER_MODEL: ${{ vars.LOOPKEEPER_MODEL || 'gpt-5.6-luna' }}
          LOOPKEEPER_API_STYLE: ${{ vars.LOOPKEEPER_API_STYLE || 'responses' }}
          LOOPKEEPER_API_BASE_URL: ${{ vars.LOOPKEEPER_API_BASE_URL || '' }}
          LOOPKEEPER_REASONING_EFFORT: ${{ vars.LOOPKEEPER_REASONING_EFFORT || 'medium' }}
          LOOPKEEPER_MAX_INPUT_BYTES: ${{ vars.LOOPKEEPER_MAX_INPUT_BYTES || '600000' }}
          LOOPKEEPER_PR_FILE_MAX_PATCH_BYTES: ${{ vars.LOOPKEEPER_PR_FILE_MAX_PATCH_BYTES || '' }}
          LOOPKEEPER_PR_FILE_BUDGET_PERCENT: ${{ vars.LOOPKEEPER_PR_FILE_BUDGET_PERCENT || '50' }}
          LOOPKEEPER_MAX_OUTPUT_TOKENS: ${{ vars.LOOPKEEPER_MAX_OUTPUT_TOKENS || '32000' }}
          LOOPKEEPER_MAX_OUTPUT_BYTES: ${{ vars.LOOPKEEPER_MAX_OUTPUT_BYTES || '50000' }}
          LOOPKEEPER_REQUEST_TIMEOUT: ${{ vars.LOOPKEEPER_REQUEST_TIMEOUT || '900' }}
          LOOPKEEPER_JOB_TIMEOUT_SECONDS: 1200
          LOOPKEEPER_EVENT_NAME: ${{ github.event_name }}
          LOOPKEEPER_PR_ACTION: ${{ github.event.action || '' }}
          LOOPKEEPER_EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          LOOPKEEPER_CI_WORKFLOW_NAME: CI
          LOOPKEEPER_CI_WORKFLOW_FILE: ci.yml
          LOOPKEEPER_POLICY_PATH: .github/codex/review-policy.md
          LOOPKEEPER_CONTEXT_PATH: .github/codex/context-files.txt
          LOOPKEEPER_CHECK_MAX_RAW_BYTES: ${{ vars.LOOPKEEPER_CHECK_MAX_RAW_BYTES || '1000000' }}
          LOOPKEEPER_OPERATOR: "1"
          LOOPKEEPER_ARTIFACT_DIR: ${{ github.workspace }}/loopkeeper-writer-artifacts
        run: |
          set -euo pipefail
          # The privileged writer receives only the already-verified artifact.
          # Fail closed if a model credential ever reaches this job, and strip
          # inherited credential names before invoking the external adapter.
          [[ -z "${OPENAI_API_KEY-}" && -z "${LOOPKEEPER_MODEL_API_KEY-}" ]]
          env -u OPENAI_API_KEY -u LOOPKEEPER_MODEL_API_KEY \
            "$LOOPKEEPER_ROOT/adapters/github/review_pr.sh" "${{ matrix.pr_number }}"
