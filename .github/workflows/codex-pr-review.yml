name: Codex PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
  schedule:
    - cron: "17 2 * * 1-5"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: codex-pr-review-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEX_REVIEW_ENABLED: ${{ vars.CODEX_REVIEW_ENABLED }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
      DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}

    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.147.0

      - name: Select PRs
        id: targets
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            gh pr list --repo "$GH_REPO" --state open --json number,labels \
              --jq '[.[] | select([.labels[].name] | index("codex-review")) | .number] | .[]' \
              > /tmp/codex-pr-numbers
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s\n' "$DISPATCH_PR_NUMBER" > /tmp/codex-pr-numbers
          else
            printf '%s\n' "$EVENT_PR_NUMBER" > /tmp/codex-pr-numbers
          fi
          if [[ ! -s /tmp/codex-pr-numbers ]]; then
            echo "No PRs selected for Codex review."
          else
            echo "Selected PRs: $(tr '\n' ' ' < /tmp/codex-pr-numbers)"
          fi

      - name: Run read-only Codex reviews
        continue-on-error: true
        run: |
          while IFS= read -r pr_number; do
            [[ -n "$pr_number" ]] || continue
            scripts/codex_review_pr.sh "$pr_number"
          done < /tmp/codex-pr-numbers
