name: Codex PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
  schedule:
    - cron: "17 2 * * 1-5"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: >-
    codex-pr-review-${{
      github.event.pull_request.number
      || github.event.workflow_run.pull_requests[0].number
      || github.event.workflow_run.head_sha
      || inputs.pr_number
      || github.run_id
    }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      vars.CODEX_REVIEW_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    # Must exceed CODEX_REQUEST_TIMEOUT with room to sanitize and post the
    # comment afterwards. At parity the job is killed at the instant the
    # request gives up, so a slow generation loses the review either way.
    timeout-minutes: 20
    env:
      CODEX_REVIEW_ENABLED: ${{ vars.CODEX_REVIEW_ENABLED }}
      CODEX_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      CODEX_MODEL: ${{ vars.CODEX_MODEL || 'gpt-5.3-codex' }}
      CODEX_REASONING_EFFORT: ${{ vars.CODEX_REASONING_EFFORT || 'medium' }}
      CODEX_MAX_ITEMS: ${{ vars.CODEX_MAX_ITEMS || '10' }}
      # The review input includes the complete sanitized PR diff plus the
      # trusted review contract. Keep the fallback large enough for the
      # repository's generated/data-heavy PRs; repository variables may tune
      # it higher when needed.
      CODEX_MAX_INPUT_BYTES: ${{ vars.CODEX_MAX_INPUT_BYTES || '600000' }}
      CODEX_MAX_OUTPUT_TOKENS: ${{ vars.CODEX_MAX_OUTPUT_TOKENS || '32000' }}
      CODEX_MAX_OUTPUT_BYTES: ${{ vars.CODEX_MAX_OUTPUT_BYTES || '50000' }}
      CODEX_REQUEST_TIMEOUT: ${{ vars.CODEX_REQUEST_TIMEOUT || '900' }}
      # Must equal timeout-minutes below, in seconds. The worker validates
      # the configured request timeout against it, so an override that the
      # job cannot outlive fails fast instead of being killed mid-request.
      CODEX_JOB_TIMEOUT_SECONDS: '1200'
      CODEX_BOT_LOGIN: ${{ vars.CODEX_BOT_LOGIN || 'github-actions[bot]' }}
      CODEX_EVENT_NAME: ${{ github.event_name }}
      CODEX_CI_WORKFLOW_FILE: ${{ vars.CODEX_CI_WORKFLOW_FILE || 'ci.yml' }}
      CODEX_CI_DISCOVERY_SECONDS: ${{ vars.CODEX_CI_DISCOVERY_SECONDS || '60' }}
      CODEX_CI_DISCOVERY_POLL_SECONDS: ${{ vars.CODEX_CI_DISCOVERY_POLL_SECONDS || '10' }}
      CODEX_CHECK_MAX_ITEMS: ${{ vars.CODEX_CHECK_MAX_ITEMS || '50' }}
      CODEX_CHECK_MAX_BYTES: ${{ vars.CODEX_CHECK_MAX_BYTES || '20000' }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
      DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
    outputs:
      pr_numbers: ${{ steps.targets.outputs.pr_numbers }}

    steps:
      # Stamped before checkout so the worker's remaining-budget check counts
      # every second the job has actually spent, not a guessed setup constant.
      - name: Stamp the job deadline
        run: echo "CODEX_JOB_DEADLINE_EPOCH=$(( $(date +%s) + CODEX_JOB_TIMEOUT_SECONDS ))" >>"$GITHUB_ENV"

      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      # The reviewer's entire trusted-instructions channel (contract, review
      # policy) is read from THIS checkout. Stamping its SHA lets the worker
      # verify it is still standing on the trusted ref instead of trusting
      # that nothing moved the working tree between here and the read.
      - name: Stamp the trusted checkout SHA
        run: echo "CODEX_TRUSTED_SHA=$(git rev-parse HEAD)" >>"$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Select PRs
        id: targets
        env:
          WORKFLOW_RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ ! "$CODEX_MAX_ITEMS" =~ ^[1-9][0-9]*$ ]]; then
            echo "CODEX_MAX_ITEMS must be a positive integer." >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            gh pr list --repo "$GH_REPO" --state open --json number,labels \
              --jq '[.[] | select([.labels[].name] | index("codex-review")) | .number] | .[]' \
              > /tmp/codex-pr-all
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s\n' "$DISPATCH_PR_NUMBER" > /tmp/codex-pr-all
          elif [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ ! "$WORKFLOW_RUN_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "WORKFLOW_RUN_HEAD_SHA must be a full lowercase commit SHA." >&2
              exit 1
            fi
            if [[ "$WORKFLOW_RUN_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              printf '%s\n' "$WORKFLOW_RUN_PR_NUMBER" > /tmp/codex-pr-all
            else
              gh api "repos/${GH_REPO}/commits/${WORKFLOW_RUN_HEAD_SHA}/pulls?per_page=100" \
                --jq '[.[] | select(.state == "open")] | length' > /tmp/codex-pr-count
              PULL_COUNT="$(cat /tmp/codex-pr-count)"
              if [[ "$PULL_COUNT" != "1" ]]; then
                echo "### Codex PR review skipped" >> "$GITHUB_STEP_SUMMARY"
                echo "- No unique open pull request for head \`${WORKFLOW_RUN_HEAD_SHA}\`." >> "$GITHUB_STEP_SUMMARY"
                : > /tmp/codex-pr-all
              else
                gh api "repos/${GH_REPO}/commits/${WORKFLOW_RUN_HEAD_SHA}/pulls?per_page=100" \
                  --jq '[.[] | select(.state == "open")][0].number' > /tmp/codex-pr-all
              fi
            fi
            if [[ -s /tmp/codex-pr-all ]]; then
              echo "CODEX_EXPECTED_HEAD_SHA=$WORKFLOW_RUN_HEAD_SHA" >> "$GITHUB_ENV"
            fi
          else
            printf '%s\n' "$EVENT_PR_NUMBER" > /tmp/codex-pr-all
          fi
          TOTAL=$(wc -l < /tmp/codex-pr-all | tr -d ' ')
          head -n "$CODEX_MAX_ITEMS" /tmp/codex-pr-all > /tmp/codex-pr-numbers
          SELECTED=$(wc -l < /tmp/codex-pr-numbers | tr -d ' ')
          if (( TOTAL > SELECTED )); then
            echo "Selected $SELECTED of $TOTAL PRs because CODEX_MAX_ITEMS=$CODEX_MAX_ITEMS."
          fi
          if [[ ! -s /tmp/codex-pr-numbers ]]; then
            echo "No PRs selected for Codex review."
          else
            echo "Selected PRs: $(tr '\n' ' ' < /tmp/codex-pr-numbers)"
          fi
          PR_NUMBERS_JSON="$(jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)' /tmp/codex-pr-numbers)"
          echo "pr_numbers=$PR_NUMBERS_JSON" >> "$GITHUB_OUTPUT"

      - name: Run read-only Codex reviews
        id: run_reviews
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          selected=0
          failed=0
          while IFS= read -r pr_number; do
            [[ -n "$pr_number" ]] || continue
            selected=$((selected + 1))
            scripts/codex_review_pr.sh "$pr_number"
            status=$?
            if (( status != 0 )); then
              failed=$((failed + 1))
              echo "::warning::Codex review failed for PR #$pr_number (exit $status)."
            fi
          done < /tmp/codex-pr-numbers
          {
            echo "### Codex PR Review"
            echo "- Selected: $selected"
            echo "- Failed: $failed"
            echo "- Model: $CODEX_MODEL"
            echo "- Reasoning effort: $CODEX_REASONING_EFFORT"
          } >> "$GITHUB_STEP_SUMMARY"
          if (( failed > 0 )); then
            exit 1
          fi

  arbiter:
    if: vars.CODEX_REVIEW_ENABLED == 'true' && needs.review.result == 'success'
    needs: [review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      CODEX_BOT_LOGIN: ${{ vars.CODEX_BOT_LOGIN || 'github-actions[bot]' }}
      ARBITER_OPERATOR: ${{ vars.ARBITER_AUTOPOST }}
      PR_NUMBERS_JSON: ${{ needs.review.outputs.pr_numbers }}
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Evaluate review-loop dispositions
        run: |
          set -euo pipefail
          while IFS= read -r pr_number; do
            [[ -n "$pr_number" ]] || continue
            decision_file="$(mktemp)"
            arbiter_args=("$pr_number" --repo "$GH_REPO" --json)
            if [[ "$ARBITER_OPERATOR" == "1" ]]; then
              arbiter_args+=(--post)
            fi
            python3 scripts/codex_arbiter.py "${arbiter_args[@]}" >"$decision_file"
            {
              echo "### Arbiter disposition for PR #$pr_number"
              echo '```json'
              cat "$decision_file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            rm -f "$decision_file"
          done < <(jq -r '.[]' <<<"${PR_NUMBERS_JSON:-[]}")
