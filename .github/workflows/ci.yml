name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      # tests/test_frontdoor.py asserts /app serves the built Relay shell.
      # app/static/relay/ is generated, not committed, so a fresh checkout has
      # no shell and those tests 503 unless the frontend is built first.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Relay frontend
        run: npm ci && npm run build
        working-directory: frontend

      - name: Run tests
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # `npm run build` is `tsc --noEmit && vite build`, so this covers the
      # typecheck as well as the production bundle.
      - name: Typecheck and build
        run: npm run build
        working-directory: frontend

      # File parallelism is disabled deliberately: the preferred-tier Case Desk
      # test is load-sensitive under the default runner. See CLAUDE.md.
      - name: Unit and integration tests
        run: npm test -- --no-file-parallelism
        working-directory: frontend

      - name: Bundle budget
        run: npm run check:bundle
        working-directory: frontend
