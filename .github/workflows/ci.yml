name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# A fresh push supersedes the in-flight run for the same PR: the old result
# says nothing about the head anyone can review.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      # tests/test_frontdoor.py asserts /app serves the built Relay shell.
      # app/static/relay/ is generated, not committed, so a fresh checkout has
      # no shell and those tests 503 unless the frontend is built first.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Relay frontend
        run: npm ci && npm run build
        working-directory: frontend

      - name: Run tests
        run: python -m pytest tests/ -q

  # The Codex automation scripts are shell, so pytest cannot reach them. This
  # job is what makes the marker-suppression regression test a real gate.
  codex-automation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Shell syntax
        run: |
          bash -n scripts/codex_review_pr.sh
          bash -n scripts/codex_triage_issue.sh
          bash -n scripts/verify_before_push.sh

      - name: Codex automation assertions
        # CODEX_VERIFY_ACTION_PINS resolves every pinned SHA against the release
        # named in its trailing comment, so a well-formed but wrong SHA cannot
        # ride in behind a plausible annotation. An unreachable API leaves the
        # pin unverified rather than failing the run.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEX_VERIFY_ACTION_PINS: "1"
        run: bash tests/test_codex_automation.sh

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # `npm run build` is `tsc --noEmit && vite build`, so this covers the
      # typecheck as well as the production bundle.
      - name: Typecheck and build
        run: npm run build
        working-directory: frontend

      # File parallelism is disabled deliberately: the preferred-tier Case Desk
      # test is load-sensitive under the default runner. See CLAUDE.md.
      - name: Unit and integration tests
        run: npm test -- --no-file-parallelism
        working-directory: frontend

      - name: Bundle budget
        run: npm run check:bundle
        working-directory: frontend

      - name: Base UI import boundary
        run: npm run check:base-ui-boundary
        working-directory: frontend

  # Exercise the same fail-closed gate developers run before asking for
  # review. This deliberately runs in a clean environment so DB isolation,
  # artifact scanning, Sentry credential clearing, and final HEAD validation
  # are behaviorally tested rather than covered only by shell syntax checks.
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Refresh the base ref
        run: git fetch --no-tags origin main

      - name: Run the complete local verification gate
        run: scripts/verify_before_push.sh origin/main

  # The normal matrix intentionally uses the base install, so the optional
  # provider package is not imported there. This job installs the exact AI
  # extra used by Vercel and exercises the real OpenAI Responses request
  # serialization with a transport-level recorder and no network call.
  tutor-provider-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the exact AI extra
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,ai]"

      - name: Assert the production provider packages import
        run: |
          python -c "import openai, pydantic_ai; print(f'pydantic-ai={pydantic_ai.__version__} openai={openai.__version__}')"

      - name: Verify provider request serialization
        run: python -m pytest tests/tutor/test_provider_contract.py -q

  # Mirror Vercel's non-editable package install and frontend build, then
  # inspect the built artifact plus the resolved provider distributions. This
  # is the release gate for the timeout headroom assumed by /api/tutor/chat.
  tutor-release-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the Vercel Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[ai]"

      - name: Install the Vercel frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build the Vercel frontend artifact
        run: npm run build
        working-directory: frontend

      - name: Verify the final tutor release contract
        run: python scripts/verify_tutor_release.py

  # Opt-in only. The deterministic half of the tutor contract already runs in
  # `test` above, with no provider and no key; this job is the half that needs a
  # model. It is gated on a repository variable rather than merely on the secret
  # existing, so turning it on is a deliberate act and a leaked-then-revoked key
  # cannot silently start (or stop) gating merges.
  #
  # It must never become required. A job that fails when a provider has an
  # outage, a quota lapse, or a model deprecation stops being a signal about
  # Relay and becomes noise about someone else's infrastructure.
  tutor-live-eval:
    runs-on: ubuntu-latest
    if: vars.RUN_TUTOR_LIVE_EVAL == 'true'
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with the AI extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ai,eval]"

      - name: Run the tutor golden set against a live provider
        env:
          TUTOR_ENABLED: "true"
          TUTOR_PROVIDER: openai
          TUTOR_MODEL: ${{ vars.TUTOR_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/run_tutor_eval.py --provider live --output tutor-eval.json

      # Aggregate scores and question IDs only — the script writes no prompts,
      # answers, or transcripts, so this artifact is safe to keep.
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tutor-eval
          path: tutor-eval.json
