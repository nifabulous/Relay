name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      # tests/test_frontdoor.py asserts /app serves the built Relay shell.
      # app/static/relay/ is generated, not committed, so a fresh checkout has
      # no shell and those tests 503 unless the frontend is built first.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Relay frontend
        run: npm ci && npm run build
        working-directory: frontend

      - name: Run tests
        run: python -m pytest tests/ -q

  # The Codex automation scripts are shell, so pytest cannot reach them. This
  # job is what makes the marker-suppression regression test a real gate.
  codex-automation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Shell syntax
        run: |
          bash -n scripts/codex_review_pr.sh
          bash -n scripts/codex_triage_issue.sh

      - name: Codex automation assertions
        run: bash tests/test_codex_automation.sh

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # `npm run build` is `tsc --noEmit && vite build`, so this covers the
      # typecheck as well as the production bundle.
      - name: Typecheck and build
        run: npm run build
        working-directory: frontend

      # File parallelism is disabled deliberately: the preferred-tier Case Desk
      # test is load-sensitive under the default runner. See CLAUDE.md.
      - name: Unit and integration tests
        run: npm test -- --no-file-parallelism
        working-directory: frontend

      - name: Bundle budget
        run: npm run check:bundle
        working-directory: frontend

  # Opt-in only. The deterministic half of the tutor contract already runs in
  # `test` above, with no provider and no key; this job is the half that needs a
  # model. It is gated on a repository variable rather than merely on the secret
  # existing, so turning it on is a deliberate act and a leaked-then-revoked key
  # cannot silently start (or stop) gating merges.
  #
  # It must never become required. A job that fails when a provider has an
  # outage, a quota lapse, or a model deprecation stops being a signal about
  # Relay and becomes noise about someone else's infrastructure.
  tutor-live-eval:
    runs-on: ubuntu-latest
    if: vars.RUN_TUTOR_LIVE_EVAL == 'true'
    continue-on-error: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install with the AI extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ai,eval]"

      - name: Run the tutor golden set against a live provider
        env:
          TUTOR_ENABLED: "true"
          TUTOR_PROVIDER: openai
          TUTOR_MODEL: ${{ vars.TUTOR_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/run_tutor_eval.py --provider live --output tutor-eval.json

      # Aggregate scores and question IDs only — the script writes no prompts,
      # answers, or transcripts, so this artifact is safe to keep.
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tutor-eval
          path: tutor-eval.json
