name: Codex Issue Triage

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage
        required: true
        type: string
  schedule:
    - cron: "47 3 * * 2,4"

permissions:
  contents: read
  issues: write

concurrency:
  group: codex-issue-triage-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEX_REVIEW_ENABLED: ${{ vars.CODEX_REVIEW_ENABLED }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_ACTION: ${{ github.event.action }}
      EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
      EVENT_LABEL_NAME: ${{ github.event.label.name }}
      DISPATCH_ISSUE_NUMBER: ${{ inputs.issue_number }}

    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.147.0

      - name: Select issues
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            gh issue list --repo "$GH_REPO" --state open --json number,labels \
              --jq '[.[] | select([.labels[].name] | index("codex-triage")) | .number] | .[]' \
              > /tmp/codex-issue-numbers
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s\n' "$DISPATCH_ISSUE_NUMBER" > /tmp/codex-issue-numbers
          elif [[ "$EVENT_ACTION" == "labeled" && "$EVENT_LABEL_NAME" != "codex-triage" ]]; then
            : > /tmp/codex-issue-numbers
          else
            printf '%s\n' "$EVENT_ISSUE_NUMBER" > /tmp/codex-issue-numbers
          fi
          if [[ ! -s /tmp/codex-issue-numbers ]]; then
            echo "No issues selected for Codex triage."
          else
            echo "Selected issues: $(tr '\n' ' ' < /tmp/codex-issue-numbers)"
          fi

      - name: Run read-only Codex triage
        continue-on-error: true
        run: |
          while IFS= read -r issue_number; do
            [[ -n "$issue_number" ]] || continue
            scripts/codex_triage_issue.sh "$issue_number"
          done < /tmp/codex-issue-numbers
