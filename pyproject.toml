[project]
name = "swift-routing"
version = "0.1.0"
description = "SWIFT intermediary bank lookup + IBAN/BIC validation API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "schwifty>=2024.5.0",
    "pydantic>=2.5",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8.0", "httpx>=0.27", "pytest-cov>=4.0", "ruff>=0.4", "alembic>=1.13"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Focus on real bugs (E/F/I), not pyupgrade (UP). The floor moved to 3.10, so
# UP's rewrites (str | None, list[str]) would now be legal — but enabling it
# would rewrite the entire existing codebase in one sweep. Keep it off; adopt
# the newer syntax in new code by choice, not by mass migration.
select = ["E", "F", "I"]
ignore = [
    "E501",  # line length handled by formatter, not critical for existing code
    "E402",  # module-level import not at top — logger pattern inserts between groups
]
