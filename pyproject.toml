[project]
name = "swift-routing"
version = "0.1.0"
description = "SWIFT intermediary bank lookup + IBAN/BIC validation API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "schwifty>=2024.5.0",
    "pydantic>=2.5",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8.0", "httpx>=0.27", "pytest-cov>=4.0", "ruff>=0.4", "alembic>=1.13"]

# The AI tutor's provider adapter. Deliberately NOT a base dependency: the app
# must import, boot, and serve every existing route with none of this installed
# and TUTOR_ENABLED=false. Only the Vercel function build installs `.[ai]`.
# Major-pinned because pydantic-ai's 1.x -> 2.x bump changed the agent API.
ai = [
    "pydantic-ai>=2.0,<3",
    "openai>=3.0,<4",
]

# Tracing is separate from `ai` so a deployment can run the tutor without
# shipping an observability client it has no keys for.
tracing = ["langfuse>=4.0,<5"]

# Evaluation is separate from BOTH, and production installs neither. Ragas
# pulls a large LLM-framework tree and must never be reachable from the request
# path; keeping it in its own extra makes an accidental runtime import
# impossible rather than merely discouraged.
eval = ["ragas>=0.4,<1"]

# Optional PII enhancement layered on top of the deterministic redactor in
# app/tutor/redaction.py, which stays unconditional and dependency-free.
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Focus on real bugs (E/F/I), not pyupgrade (UP). The floor moved to 3.10, so
# UP's rewrites (str | None, list[str]) would now be legal — but enabling it
# would rewrite the entire existing codebase in one sweep. Keep it off; adopt
# the newer syntax in new code by choice, not by mass migration.
select = ["E", "F", "I"]
ignore = [
    "E501",  # line length handled by formatter, not critical for existing code
    "E402",  # module-level import not at top — logger pattern inserts between groups
]
